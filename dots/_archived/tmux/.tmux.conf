set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys,ghostty:RGB:extkeys,alacritty:RGB:extkeys,kitty:RGB:extkeys"
set -s escape-time 0
set -g extended-keys always
set -g extended-keys-format csi-u
set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on

## -- SESH -- ##
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

bind -N "last sesh session" L run-shell "sesh last"
bind -N "connect cwd as root session" 9 run-shell "sesh connect --root $(pwd)"

bind-key -N "pick root session" R display-popup -E -w 40% "sesh connect \"$(
  sesh list -i -H | gum filter --value \"$(sesh root)\" --limit 1 --fuzzy --no-sort --placeholder 'Pick a sesh' --prompt='⚡ '
)\""

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Minimal Zellij-ish status bar
set -g status-position bottom
set -g status on
set -gu status-format
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 80
set -g status-right-length 100
set -g status-left "#[bg=#181825] #{?client_prefix,#[bg=#f9e2af]#[fg=#11111b]#[bold] PREFIX ,#[bg=#a6e3a1]#[fg=#11111b]#[bold] NORMAL }#[bg=#181825]  #[fg=#cba6f7]#[bold]#S  "
set -g status-right "#{?client_prefix,#[bg=#f9e2af]#[fg=#11111b]#[bold] c:new x:kill v:split-down h:split-right z:zoom hjkl:move T:win ?:help ,#{?pane_synchronized,#[bg=#f38ba8]#[fg=#11111b]#[bold] SYNC #[bg=#181825]  ,}#[fg=#7f849c]C-a ? help  #[fg=#89b4fa]%I:%M %p }"
set -g window-status-separator ""
set -g window-status-format "#[fg=#7f849c] #I:#W "
set -g window-status-current-format "#[bg=#89b4fa]#[fg=#11111b]#[bold] #I:#W #[bg=#181825] "

# Pane styling
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status off
set -g display-panes-colour "#f9e2af"
set -g display-panes-active-colour "#89b4fa"

bind-key -N "reload tmux config" r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind-key -N "show tmux help" ? display-popup -E -w 82% -h 75% -T "tmux help" "tmux-help-tv"
bind-key -N "cycle pane layout" Space next-layout
bind-key -N "search scrollback" / display-popup -E -w 82% -h 75% -T "scrollback search" "tmux-scrollback-search"
bind-key -N "edit scrollback" E display-popup -E -w 90% -h 80% -T "scrollback" "tmux-edit-scrollback"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'tmux-copy'

# vim-like pane/window switching
bind -r ^ last-window
bind-key -N "new window in current dir" c new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"
bind-key -N "rename current window" , command-prompt -p "window name:" "rename-window -- \"%%%\""
bind-key -N "rename current session" A command-prompt -p "session name:" "rename-session -- \"%%%\""
bind-key -N "split down in current dir" '"' split-window -v -c "#{pane_current_path}"
bind-key -N "split right in current dir" % split-window -h -c "#{pane_current_path}"
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Zellij-inspired direct binds
bind-key -n C-S-h select-pane -L
bind-key -n C-S-j select-pane -D
bind-key -n C-S-k select-pane -U
bind-key -n C-S-l select-pane -R
bind-key -n C-\\ split-window -h -c "#{pane_current_path}"
bind-key -n C-S-\\ split-window -v -c "#{pane_current_path}"
bind-key -n C-S-Enter resize-pane -Z
# C-; often arrives as Escape, so use C-S-x for direct close.
bind-key -n C-S-x kill-pane
bind-key -n M-H previous-window
bind-key -n M-L next-window
bind-key -n C-S-n new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"
# Swallow C-Enter: Ghostty/tmux forwards it as an extended key that flickers apps.
bind-key -n C-Enter send-keys -N 0 Enter

# Zellij-style transient modes
bind-key -n C-S-p switch-client -T zellij-pane \; display-message "pane: h/j/k/l move H/J/K/L resize n/N split d kill f zoom s sync"
bind-key -T zellij-pane h select-pane -L
bind-key -T zellij-pane j select-pane -D
bind-key -T zellij-pane k select-pane -U
bind-key -T zellij-pane l select-pane -R
bind-key -r -T zellij-pane H resize-pane -L 5
bind-key -r -T zellij-pane J resize-pane -D 5
bind-key -r -T zellij-pane K resize-pane -U 5
bind-key -r -T zellij-pane L resize-pane -R 5
bind-key -T zellij-pane n split-window -h -c "#{pane_current_path}"
bind-key -T zellij-pane N split-window -v -c "#{pane_current_path}"
bind-key -T zellij-pane d kill-pane
bind-key -T zellij-pane f resize-pane -Z
bind-key -T zellij-pane s set-window-option synchronize-panes \; display-message "sync panes: #{?pane_synchronized,on,off}"

bind-key -n C-S-t switch-client -T zellij-window \; display-message "window: h/l prev/next 1-9 jump n new r rename d kill s sync Tab last"
bind-key -T zellij-window h previous-window
bind-key -T zellij-window l next-window
bind-key -T zellij-window Tab last-window
bind-key -T zellij-window n new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"
bind-key -T zellij-window r command-prompt -p "window name:" "rename-window -- \"%%%\""
bind-key -T zellij-window d kill-window
bind-key -T zellij-window s set-window-option synchronize-panes \; display-message "sync panes: #{?pane_synchronized,on,off}"
bind-key -T zellij-window 1 select-window -t :1
bind-key -T zellij-window 2 select-window -t :2
bind-key -T zellij-window 3 select-window -t :3
bind-key -T zellij-window 4 select-window -t :4
bind-key -T zellij-window 5 select-window -t :5
bind-key -T zellij-window 6 select-window -t :6
bind-key -T zellij-window 7 select-window -t :7
bind-key -T zellij-window 8 select-window -t :8
bind-key -T zellij-window 9 select-window -t :9

bind-key -n C-S-r switch-client -T zellij-resize \; display-message "resize: h/j/k/l shrink/grow pane"
bind-key -r -T zellij-resize h resize-pane -L 5
bind-key -r -T zellij-resize j resize-pane -D 5
bind-key -r -T zellij-resize k resize-pane -U 5
bind-key -r -T zellij-resize l resize-pane -R 5
bind-key -r -T zellij-resize H resize-pane -R 5
bind-key -r -T zellij-resize J resize-pane -U 5
bind-key -r -T zellij-resize K resize-pane -D 5
bind-key -r -T zellij-resize L resize-pane -L 5

bind -r D new -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# project/session shortcuts
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r i run-shell "tmux neww tmux-cht.sh"
bind-key -r C run-shell "~/.local/bin/tmux-sessionizer ~/work/tvui"
bind-key -r M run-shell "~/.local/bin/tmux-sessionizer ~/work/milo"
bind-key -r H run-shell "~/.local/bin/tmux-sessionizer ~/personal/vim-with-me"
bind-key -r N run-shell "~/.local/bin/tmux-sessionizer ~/personal/harpoon"
bind-key -r P run-shell "~/.local/bin/tmux-sessionizer ~/personal/developer-productivity"

# session/window tools
bind-key -N "open window mode" T switch-client -T zellij-window \; display-message "window: h/l prev/next 1-9 jump n new r rename d kill s sync Tab last"
bind-key -N "open session/project picker" G display-popup -E -w 82% -h 75% -T "sesh" "tmux-sesh-tv"
bind-key -N "manage tmux sessions" W display-popup -E -w 82% -h 75% -T "sessions" "tmux-session-manager-tv"

# tools
bind-key -N "open lazygit popup" g display-popup -E -w 90% -h 80% -d '#{pane_current_path}' lazygit
bind-key -N "open shell popup" e display-popup -E -w 90% -h 80% -d '#{pane_current_path}' "$SHELL"
bind-key -N "open url from pane history" u run-shell "tmux-url-picker open"
bind-key -N "copy url from pane history" U run-shell "tmux-url-picker copy"
bind-key -N "toggle synchronized panes" S set-window-option synchronize-panes \; display-message "sync panes: #{?pane_synchronized,on,off}"
