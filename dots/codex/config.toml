#:schema https://developers.openai.com/codex/config-schema.json

# Model and behavior
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
default_permissions = ":workspace"
personality = "pragmatic"
service_tier = "fast"
approvals_reviewer = "auto_review"
web_search = "live"
project_root_markers = [".git", ".jj"]
allow_login_shell = false

notify = ["/Users/kenrictee/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[features]
computer_use = true
memories = true
prevent_idle_sleep = true

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 4

[analytics]
enabled = false

[feedback]
enabled = false

# Terminal preferences
[history]
max_bytes = 5242880 # 5 MiB of CLI input history

[tui]
session_picker_view = "dense"
status_line = [
  "thread-name",
  "model-with-reasoning",
  "current-dir",
  "branch-changes",
  "context-used",
  "weekly-limit",
  "used-tokens",
  "fast-mode",
]
screen_reader_detection_done = true
status_line_use_colors = true

[tui.keymap.chat]
decrease_reasoning_effort = "shift-down"
increase_reasoning_effort = "shift-up"

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4

# Desktop preferences
[desktop]
followUpQueueMode = "queue"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-commit-instructions = "tag it with `<tag>: <commit message>`"
git-pr-instructions = "Write summary of changes. Cite specific files."
notifications-turn-mode = "always"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "persistent", "max"]
show-context-window-usage = true

